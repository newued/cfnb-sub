name: Auto Update Subscription

on:
  schedule:
    # 每 30 分钟运行（UTC）。避开整点高峰，错开为 :07 / :37
    - cron: "7,37 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "cloud/gen_sub.py"

permissions:
  contents: write

concurrency:
  group: sub-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate subscription
        run: |
          python cloud/gen_sub.py
          echo "---- 生成结果 ----"
          wc -l sub_final.txt
          head -3 sub_final.txt

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sub_final.txt sub_final_b64.txt
          if git diff --cached --quiet; then
            echo "订阅内容无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore: auto update subscription $(date -u +%Y-%m-%dT%H:%MZ)"

          # 并发触发（定时器 + 手动 + push）时可能撞车，失败就拉取后重试
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "推送成功（第 $i 次尝试）"
              exit 0
            fi
            echo "推送被拒，第 $i 次重试：先同步远端"
            git pull --rebase --autostash -X ours origin main || true
            sleep $((i * 3))
          done
          echo "连续 5 次推送失败"
          exit 1
